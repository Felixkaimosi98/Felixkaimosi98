<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>MKTraders</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header><h1>MK Traders - Live Trading</h1></header>
  <div class="balance-box">Balance: <span id="balance">Loading...</span></div>

  <div class="trade-form">
    <input id="amount" type="number" placeholder="Amount" />
    <button id="buyUp">Buy Up</button>
    <button id="buyDown">Buy Down</button>
  </div>

  <div class="log" id="log"></div>

  <script src="app.js"></script>
</body>
</html>
